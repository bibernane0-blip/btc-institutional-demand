name: V5.3 Price Volume Research Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run V5.3 backtest
        run: python backtest_v53.py

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: v53-backtest-reports
          path: |
            backtest_v53_results.json
            backtest_v53_trades.csv
          if-no-files-found: error
