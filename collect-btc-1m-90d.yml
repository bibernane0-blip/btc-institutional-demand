name: Collect BTC 1m 90-day history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Download and validate 90-day OKX BTC-USDT 1m candles
        run: python collect_btc_1m.py --days 90 --output btc_usdt_1m_90d.json.gz
      - name: Upload collected data and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-usdt-1m-90d
          path: |
            btc_usdt_1m_90d.json.gz
            btc_usdt_1m_90d.json.metadata.json
          if-no-files-found: error
          retention-days: 30
