name: Collect BTC market history V5.1

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-history-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Collect market data
        run: python collect_market_history.py
      - name: Commit history only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V5.1 market history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
