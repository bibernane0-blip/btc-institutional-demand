name: BTC Historical OI Backfill V7.18
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-history-writer
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Fetch exchange-native historical OI
        run: python collect_historical_oi.py
      - name: Commit historical OI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical_oi.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Backfill OKX historical OI [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
