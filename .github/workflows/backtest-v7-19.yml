name: BTC Historical Backtest V7.19
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install requests
      - name: Run offline backtest
        run: python backtest_v7_19.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-v7-19-results
          path: |
            backtest_v7_19_results.json
            backtest_v7_19_trades.csv
