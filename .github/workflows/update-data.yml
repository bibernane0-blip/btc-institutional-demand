name: Update BTC institutional flows and publish dashboard

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - update_data.py
      - requirements.txt
      - .github/workflows/update-data.yml

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh ETF and on-chain data before deployment"
        required: false
        type: boolean
        default: true

  workflow_run:
    workflows:
      - "Collect BTC market history V5.2"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data == true
        run: pip install -r requirements.txt

      - name: Refresh ETF and on-chain flow snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data == true
        env:
          KOTE_API_KEY: ${{ secrets.KOTE_API_KEY }}
        run: python update_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
