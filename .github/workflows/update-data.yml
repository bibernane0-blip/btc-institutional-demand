name: Update BTC data and publish dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market and flow data
        env:
          KOTE_API_KEY: ${{ secrets.KOTE_API_KEY }}
        run: python update_data.py

      - name: Prepare dashboard
        run: |
          mkdir -p public
          cp index.html data.json public/

      - name: Upload dashboard files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
