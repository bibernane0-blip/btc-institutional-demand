name: Binance Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Test Binance Futures API
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import hmac
          import hashlib
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ["BINANCE_API_KEY"]
          secret = os.environ["BINANCE_API_SECRET"]

          base = "https://fapi.binance.com"
          params = urllib.parse.urlencode({
              "timestamp": int(time.time() * 1000),
              "recvWindow": 5000
          })

          signature = hmac.new(
              secret.encode(),
              params.encode(),
              hashlib.sha256
          ).hexdigest()

          url = (
              f"{base}/fapi/v2/account?"
              f"{params}&signature={signature}"
          )

          request = urllib.request.Request(
              url,
              headers={"X-MBX-APIKEY": key}
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
              print("SUCCESS: Binance Futures API connection verified.")
          except urllib.error.HTTPError as error:
              print(f"FAILED: Binance API HTTP {error.code}")
              raise SystemExit(1)
          except Exception as error:
              print(f"FAILED: {type(error).__name__}")
              raise SystemExit(1)
          PY